name: Build TechDesk Monitor for Android

# TechDesk Monitor is the owner's read-only view of every branch. It is an
# Enterprise feature, which is why it lives in this repo, but it is its own
# app: its own package id (com.techdesk.monitor), its own version line, and
# its own tag (monitor-v*) so it never collides with the Enterprise desktop
# releases published from the same repo.
#
# Signing: with ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD set, this builds a signed release
# APK. Without them it falls back to debug signing, which side-loads fine but
# CANNOT be upgraded in place by a later signed build -- so set them before
# handing the APK to anyone you would have to support.
on:
  push:
    tags:
      - "monitor-v*"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/monitor

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >= 22.
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Create the Android project
        # Not committed: it is generated, large, and regenerating it is how
        # a Capacitor upgrade is meant to be applied.
        run: npx cap add android

      # ubuntu-latest already ships a licensed Android SDK. setup-android
      # tries to reinstall it through sdkmanager and fails, so use the one
      # that is already there.
      - name: Point Gradle at the runner's Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Copy the web build into the Android project
        run: npx cap sync android

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/monitor.keystore
            # Absolute, and passed on rather than retyped. Gradle resolves an
            # injected signing path against the DAEMON's working directory,
            # not the project's -- so a relative one silently becomes
            # ~/.gradle/daemon/<version>/monitor.keystore and the build fails
            # saying the keystore is missing while it is sitting right here.
            echo "keystore=$(pwd)/android/app/monitor.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing keystore configured -- building a debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: apps/monitor/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ steps.keystore.outputs.keystore }}" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build debug APK
        if: steps.keystore.outputs.signed != 'true'
        working-directory: apps/monitor/android
        run: ./gradlew assembleDebug

      - name: Check what actually signed it
        working-directory: apps/mobile
        env:
          EXPECT_SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -r | head -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"

          # The failure this exists for is silent. If a secret is missing or
          # misspelled the build falls back to a debug APK, which installs
          # perfectly today and can never be upgraded in place afterwards --
          # so the shop finds out months later, when the fix is "uninstall",
          # and uninstalling takes their records with it.
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            if [ "$EXPECT_SIGNED" = "true" ]; then
              echo "::error::Signing was configured but this APK is DEBUG signed. Do not publish it."
              exit 1
            fi
            echo "::warning::Debug-signed APK. Fine for trying on a phone; never hand it to a shop."
          else
            echo "Release signed. Fingerprint above -- it must match every future TechDesk release."
          fi

      - name: Name the APK after the version
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          DEST="TechDesk-Monitor-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "path=apps/monitor/$DEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      # Published to the releases repo, not just attached to the run. The
      # APK used to exist only as a workflow artifact, which needs a GitHub
      # login to download and expires after a few weeks -- so there was
      # nowhere to send an owner who asked for the monitoring app. Same
      # destination and same token as every other TechDesk build.
      - name: Upload to the public releases repo
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: monitor-v${{ steps.apk.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION_LABEL: ${{ steps.apk.outputs.version }}
        run: |
          gh release view "$TAG" --repo akintundeoluwaseun/TechDesk-releases- >/dev/null 2>&1 \
            || gh release create "$TAG" --repo akintundeoluwaseun/TechDesk-releases- \
                 --title "TechDesk Monitor $VERSION_LABEL" \
                 --notes "The head-office app: every branch's sales and repairs, read-only, on your phone."
          gh release upload "$TAG" "$APK" --repo akintundeoluwaseun/TechDesk-releases- --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: techdesk-monitor-apk
          path: ${{ steps.apk.outputs.path }}
