name: Build and release TechDesk

# Builds TechDesk natively on Windows, macOS, and Linux runners,
# then publishes each platform's installers to the public
# TechDesk-releases- repo (this repo stays private -- only the compiled
# installers go public, never the source). Needs a repo secret named
# RELEASES_TOKEN: a token with write access to TechDesk-releases-, since
# the default GITHUB_TOKEN only has access to this repo. Trigger by
# pushing a tag like v1.0.1, or manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The release is made once, here, before any installer is built. Left to
  # electron-builder, all three runners look for it at the same moment,
  # find nothing, and all try to create it: the first wins and the others
  # stop with "already_exists" -- which is how 4.4.2 and 4.6.0 shipped with
  # no Mac installers. Now they only ever find it and upload.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release for this version
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V=$(node -p "require('./apps/desktop/package.json').version")
          code=$(curl -s -o out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/akintundeoluwaseun/TechDesk-releases-/releases \
            -d "{\"tag_name\":\"v$V\",\"name\":\"$V\"}")
          echo "v$V: HTTP $code"
          # 201 made it; 422 means it was already there (a re-run). Anything else is a real failure.
          if [ "$code" != "201" ] && ! { [ "$code" = "422" ] && grep -q already_exists out.json; }; then cat out.json; exit 1; fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # The Windows installer is a WPF application now, not NSIS, so the
      # runner needs the .NET SDK as well as Node. Pinned to the 8.0 feature
      # band the project's global.json asks for.
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'

      - name: Build renderer
        run: npm run build

      - name: Build and publish installers (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Build and publish installers (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      # Windows is built in two halves. electron-builder stops at the
      # unpacked app folder, and build-setup.mjs turns that folder into the
      # installer: it compresses the app, publishes the WPF setup program,
      # appends one to the other, and writes latest.yml.
      - name: Build the Windows app folder
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx electron-builder --win dir --publish never

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: node setup/build-setup.mjs

      # Uploaded by hand because electron-builder is no longer the thing
      # producing the Windows artifacts, and so it can no longer publish
      # them. latest.yml matters as much as the installer: it is the file
      # every installed copy reads to find out an update exists, so if it
      # does not reach the release, updating silently stops for everyone.
      - name: Publish the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          REPO=akintundeoluwaseun/TechDesk-releases-
          V=$(node -p "require('./package.json').version")
          ID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/v$V" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id")
          echo "release v$V is $ID"

          upload () {
            NAME=$(basename "$1")
            # A re-run would otherwise collide with the asset already there.
            OLD=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$ID/assets" \
              | node -p "(JSON.parse(require('fs').readFileSync(0,'utf8')).find(a => a.name === process.argv[1]) || {}).id || ''" "$NAME")
            if [ -n "$OLD" ]; then
              echo "replacing existing $NAME"
              curl -sf -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/releases/assets/$OLD" || true
            fi
            echo "uploading $NAME ($(wc -c < "$1") bytes)"
            curl -sf --retry 3 --retry-delay 5 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$1" \
              "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=$NAME" > /dev/null
          }

          upload "release/TechDesk-Setup-$V.exe"
          upload "release/latest.yml"
          echo "Windows installer and latest.yml published"

  # The desktop app's updater asks GitHub for the LATEST release and reads its
  # latest.yml. The Android and Monitor releases live in the same repo and
  # used to be made after this one, so "latest" was an APK-only release, the
  # updater found no latest.yml, and installed desktop apps stopped updating.
  # Once every installer is up, this release is marked latest on purpose
  # (and the APK workflows create theirs with --latest=false).
  mark-latest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark this release as the latest
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V=$(node -p "require('./apps/desktop/package.json').version")
          id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/akintundeoluwaseun/TechDesk-releases-/releases/tags/v$V | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id")
          code=$(curl -s -o out.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/akintundeoluwaseun/TechDesk-releases-/releases/$id \
            -d '{"make_latest":"true"}')
          echo "v$V (release $id) marked latest: HTTP $code"
          if [ "$code" != "200" ]; then cat out.json; exit 1; fi
