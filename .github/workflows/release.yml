name: Build and release TechDesk

# Builds TechDesk natively on Windows, macOS, and Linux runners,
# then publishes each platform's installers to the public
# TechDesk-releases- repo (this repo stays private -- only the compiled
# installers go public, never the source). Needs a repo secret named
# RELEASES_TOKEN: a token with write access to TechDesk-releases-, since
# the default GITHUB_TOKEN only has access to this repo. Trigger by
# pushing a tag like v1.0.1, or manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The release is made once, here, before any installer is built. Left to
  # electron-builder, all three runners look for it at the same moment,
  # find nothing, and all try to create it: the first wins and the others
  # stop with "already_exists" -- which is how 4.4.2 and 4.6.0 shipped with
  # no Mac installers. Now they only ever find it and upload.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release for this version
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V=$(node -p "require('./apps/desktop/package.json').version")
          code=$(curl -s -o out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/akintundeoluwaseun/TechDesk-releases-/releases \
            -d "{\"tag_name\":\"v$V\",\"name\":\"$V\"}")
          echo "v$V: HTTP $code"
          # 201 made it; 422 means it was already there (a re-run). Anything else is a real failure.
          if [ "$code" != "201" ] && ! { [ "$code" = "422" ] && grep -q already_exists out.json; }; then cat out.json; exit 1; fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build and publish installers (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Build and publish installers (Windows/Linux)
        if: runner.os != 'macOS'
        working-directory: apps/desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  # The desktop app's updater asks GitHub for the LATEST release and reads its
  # latest.yml. The Android and Monitor releases live in the same repo and
  # used to be made after this one, so "latest" was an APK-only release, the
  # updater found no latest.yml, and installed desktop apps stopped updating.
  # Once every installer is up, this release is marked latest on purpose
  # (and the APK workflows create theirs with --latest=false).
  mark-latest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark this release as the latest
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V=$(node -p "require('./apps/desktop/package.json').version")
          id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/akintundeoluwaseun/TechDesk-releases-/releases/tags/v$V | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id")
          code=$(curl -s -o out.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/akintundeoluwaseun/TechDesk-releases-/releases/$id \
            -d '{"make_latest":"true"}')
          echo "v$V (release $id) marked latest: HTTP $code"
          if [ "$code" != "200" ]; then cat out.json; exit 1; fi
