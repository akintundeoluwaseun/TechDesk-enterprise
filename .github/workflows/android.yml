name: Build TechDesk for Android

# One APK. The same app as the desktop -- same screens, same records, same
# tier -- in a Capacitor shell instead of an Electron one.
#
# There is no Business APK and no Solo APK, because there is no Business or
# Solo build of anything any more. The phone app is free to use and unlocks
# in place, exactly like the desktop, and head office is refused by the
# server rather than by which file somebody downloaded.
#
# Signing: with ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD set, this builds a signed release
# APK. Without them it falls back to debug signing, which side-loads fine but
# CANNOT be upgraded in place by a later signed build. Set them before handing
# the APK to a shop, because the alternative is telling them to uninstall --
# and an uninstall takes their records with it.
on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >= 22.
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the web bundle
        run: npm run build:mobile

      - name: Create the Android project
        # Not committed: it is generated, large, and regenerating it is how a
        # Capacitor upgrade is meant to be applied.
        working-directory: apps/mobile
        run: npx cap add android

      # ubuntu-latest already ships a licensed Android SDK. setup-android tries
      # to reinstall it through sdkmanager and fails, so use the one that is
      # already there.
      - name: Point Gradle at the runner's Android SDK
        working-directory: apps/mobile
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Put the real icon on it
        # `cap add android` generates the stock Capacitor artwork, so without
        # this the app a shop installs has a generic icon in their launcher
        # and no way to tell it apart from anything else. Runs before sync so
        # the generated resources are in the project when it is copied.
        working-directory: apps/mobile
        run: npx --yes @capacitor/assets generate --android --assetPath assets

      - name: Copy the web build into the Android project
        working-directory: apps/mobile
        run: npx cap sync android

      # Voice orders record from the microphone. `cap add android` generates
      # the manifest fresh every build, so the permission is added here;
      # Capacitor's WebView then asks the person for it the first time.
      - name: Allow the microphone (voice orders)
        working-directory: apps/mobile
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' "$M"
          grep -n "RECORD_AUDIO" "$M"

      # Every build so far shipped Capacitor's defaults -- versionCode 1,
      # versionName "1.0" -- because `cap add android` generates the project
      # fresh each time and nothing told it otherwise. Android decides whether
      # an APK is an upgrade by versionCode alone, so 4.0.5 over 4.0.0 was a
      # same-version reinstall as far as the phone was concerned, and the
      # about screen said 1.0 while the shop had 4.0.5.
      #
      # 4.1.0 becomes 40100: major*10000 + minor*100 + patch. Room for 99
      # minors and 99 patches, and it only ever goes up, which is the one
      # thing Android requires.
      - name: Put the real version on the Android project
        working-directory: apps/mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+(c||0)")
          echo "versionName $VERSION, versionCode $CODE"
          sed -i "s/versionCode 1$/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Decode signing keystore
        id: keystore
        working-directory: apps/mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/techdesk.keystore
            # Absolute, and passed on rather than retyped. Gradle resolves an
            # injected signing path against the DAEMON's working directory,
            # not the project's -- so a relative one silently becomes
            # ~/.gradle/daemon/<version>/techdesk.keystore and the build fails
            # saying the keystore is missing while it is sitting right here.
            echo "keystore=$(pwd)/android/app/techdesk.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing keystore configured -- building a debug APK."
            echo "::warning::A debug APK cannot be upgraded in place later. Do not hand this to a shop."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: apps/mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE: ${{ steps.keystore.outputs.keystore }}
        run: |
          # The alias is read out of the keystore, not out of a secret.
          #
          # It was a secret, and a build died on "No key with alias '***'
          # found" -- which tells you almost nothing, because GitHub masks
          # the value, so you cannot see whether it is a typo, a stray space
          # or the wrong word entirely. The keystore holds exactly one key
          # and knows its own name. Asking it removes a whole class of
          # failure that can only be diagnosed by guessing.
          ALIAS=$(keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
                  | awk -F, '/PrivateKeyEntry/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')
          if [ -z "$ALIAS" ]; then
            echo "::error::Opened the keystore but found no private key in it."
            echo "::error::Check ANDROID_KEYSTORE_BASE64 -- it may be truncated."
            exit 1
          fi
          echo "Signing with key: $ALIAS"

          # One password. This keystore is PKCS12, where the key and the
          # store share it, so ANDROID_KEY_PASSWORD is deliberately not read
          # -- a second copy of the same value is a second chance to mistype
          # it, and it buys nothing.
          # bundleRelease: the .aab Google Play takes (Play only accepts
          # bundles). Same key, so it can be the Play "upload key".
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Build debug APK
        if: steps.keystore.outputs.signed != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Check what actually signed it
        working-directory: apps/mobile
        env:
          EXPECT_SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under $(pwd)/android/app/build/outputs/apk."
            echo "::error::Either the build produced nothing, or this step is looking in the wrong app."
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -r | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in the runner's Android SDK."
            exit 1
          fi
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"

          # The failure this exists for is silent. If a secret is missing or
          # misspelled the build falls back to a debug APK, which installs
          # perfectly today and can never be upgraded in place afterwards --
          # so the shop finds out months later, when the fix is "uninstall",
          # and uninstalling takes their records with it.
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            if [ "$EXPECT_SIGNED" = "true" ]; then
              echo "::error::Signing was configured but this APK is DEBUG signed. Do not publish it."
              exit 1
            fi
            echo "::warning::Debug-signed APK. Fine for trying on a phone; never hand it to a shop."
          else
            echo "Release signed. Fingerprint above -- it must match every future TechDesk release."
          fi

      - name: Name the APK after the version
        id: apk
        working-directory: apps/mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          DEST="TechDesk-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "path=apps/mobile/$DEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      - name: Upload to the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: android-v${{ steps.apk.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION_LABEL: ${{ steps.apk.outputs.version }}
        run: |
          gh release view "$TAG" --repo akintundeoluwaseun/TechDesk-releases- >/dev/null 2>&1 \
            || gh release create "$TAG" --repo akintundeoluwaseun/TechDesk-releases- \
                 --title "TechDesk for Android $VERSION_LABEL" \
                 --notes "The shop, on a phone. Free to use; Business and Enterprise unlock in place."
          gh release upload "$TAG" "$APK" --repo akintundeoluwaseun/TechDesk-releases- --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: techdesk-apk
          path: ${{ steps.apk.outputs.path }}

      # For the Play Console only: kept as a private download on this run
      # (Actions -> this run -> Artifacts), not on the public releases page.
      - name: Name the Play Store bundle
        id: aab
        if: steps.keystore.outputs.signed == 'true'
        working-directory: apps/mobile
        run: |
          SRC=$(find android/app/build/outputs/bundle -name "*.aab" | head -1)
          if [ -z "$SRC" ]; then echo "::error::No .aab was built."; exit 1; fi
          DEST="TechDesk-${{ steps.apk.outputs.version }}-play.aab"
          cp "$SRC" "$DEST"
          echo "path=apps/mobile/$DEST" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.signed == 'true'
        with:
          name: techdesk-play-bundle
          path: ${{ steps.aab.outputs.path }}
